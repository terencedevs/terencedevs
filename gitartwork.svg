<svg width="823" height="148" xmlns="http://www.w3.org/2000/svg">
  <title>terencedevs</title>
  <style>
    :root { --c0: rgba(27,31,35,0.06); --c1: #9be9a8; --c2: #40c463; --c3: #30a14e; --c4: #216e39; }
    .g { animation: fade 1s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <defs>
    <!-- empty contribution cell, 11x11 -->
    <rect id="o" width="11" height="11" rx="2" ry="2"/>

    <!-- empty grid: 53 columns x 7 rows -->
    <pattern id="grid" x="16" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" rx="2" ry="2" fill="var(--c0)"/>
    </pattern>

    <!-- letters: 3 columns wide, 5 rows tall -->
    <g id="t">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/><use href="#o" x="30" y="15"/>
      <use href="#o" x="15" y="30"/><use href="#o" x="15" y="45"/><use href="#o" x="15" y="60"/><use href="#o" x="15" y="75"/>
    </g>
    <g id="e">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/><use href="#o" x="30" y="15"/>
      <use href="#o" x="0" y="30"/>
      <use href="#o" x="0" y="45"/><use href="#o" x="15" y="45"/><use href="#o" x="30" y="45"/>
      <use href="#o" x="0" y="60"/>
      <use href="#o" x="0" y="75"/><use href="#o" x="15" y="75"/><use href="#o" x="30" y="75"/>
    </g>
    <g id="r">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/>
      <use href="#o" x="0" y="30"/><use href="#o" x="30" y="30"/>
      <use href="#o" x="0" y="45"/><use href="#o" x="15" y="45"/>
      <use href="#o" x="0" y="60"/><use href="#o" x="30" y="60"/>
      <use href="#o" x="0" y="75"/><use href="#o" x="30" y="75"/>
    </g>
    <g id="n">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/><use href="#o" x="30" y="15"/>
      <use href="#o" x="0" y="30"/><use href="#o" x="30" y="30"/>
      <use href="#o" x="0" y="45"/><use href="#o" x="30" y="45"/>
      <use href="#o" x="0" y="60"/><use href="#o" x="30" y="60"/>
      <use href="#o" x="0" y="75"/><use href="#o" x="30" y="75"/>
    </g>
    <g id="c">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/><use href="#o" x="30" y="15"/>
      <use href="#o" x="0" y="30"/><use href="#o" x="0" y="45"/><use href="#o" x="0" y="60"/>
      <use href="#o" x="0" y="75"/><use href="#o" x="15" y="75"/><use href="#o" x="30" y="75"/>
    </g>
    <g id="d">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/>
      <use href="#o" x="0" y="30"/><use href="#o" x="30" y="30"/>
      <use href="#o" x="0" y="45"/><use href="#o" x="30" y="45"/>
      <use href="#o" x="0" y="60"/><use href="#o" x="30" y="60"/>
      <use href="#o" x="0" y="75"/><use href="#o" x="15" y="75"/>
    </g>
    <g id="v">
      <use href="#o" x="0" y="15"/><use href="#o" x="30" y="15"/>
      <use href="#o" x="0" y="30"/><use href="#o" x="30" y="30"/>
      <use href="#o" x="0" y="45"/><use href="#o" x="30" y="45"/>
      <use href="#o" x="0" y="60"/><use href="#o" x="30" y="60"/>
      <use href="#o" x="15" y="75"/>
    </g>
    <g id="s">
      <use href="#o" x="0" y="15"/><use href="#o" x="15" y="15"/><use href="#o" x="30" y="15"/>
      <use href="#o" x="0" y="30"/>
      <use href="#o" x="0" y="45"/><use href="#o" x="15" y="45"/><use href="#o" x="30" y="45"/>
      <use href="#o" x="30" y="60"/>
      <use href="#o" x="0" y="75"/><use href="#o" x="15" y="75"/><use href="#o" x="30" y="75"/>
    </g>
  </defs>

  <g transform="translate(15, 20)">
    <!-- empty grid -->
    <rect x="16" y="0" width="791" height="101" fill="url(#grid)"/>

    <!-- T E R E N C E D E V S -->
    <use class="g" href="#t" x="91"  fill="var(--c2)" style="animation-delay:0.0s"/>
    <use class="g" href="#e" x="151" fill="var(--c3)" style="animation-delay:0.1s"/>
    <use class="g" href="#r" x="211" fill="var(--c4)" style="animation-delay:0.2s"/>
    <use class="g" href="#e" x="271" fill="var(--c3)" style="animation-delay:0.3s"/>
    <use class="g" href="#n" x="331" fill="var(--c2)" style="animation-delay:0.4s"/>
    <use class="g" href="#c" x="391" fill="var(--c3)" style="animation-delay:0.5s"/>
    <use class="g" href="#e" x="451" fill="var(--c4)" style="animation-delay:0.6s"/>
    <use class="g" href="#d" x="511" fill="var(--c3)" style="animation-delay:0.7s"/>
    <use class="g" href="#e" x="571" fill="var(--c2)" style="animation-delay:0.8s"/>
    <use class="g" href="#v" x="631" fill="var(--c3)" style="animation-delay:0.9s"/>
    <use class="g" href="#s" x="691" fill="var(--c4)" style="animation-delay:1.0s"/>
  </g>

  <a href="https://github.com/jasineri/gitartwork">
    <text x="24" y="139" font-size="0.6em" fill="blue">Get your own gitartwork on jasineri/gitartwork</text>
  </a>
</svg>
